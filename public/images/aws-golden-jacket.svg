      <stop offset="0" stop-color="#F7CB4F"/>
      <stop offset="1" stop-color="#E08D0B"/>
    </linearGradient>
    <linearGradient id="gd" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E4A82A"/>
