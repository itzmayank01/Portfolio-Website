  <!-- sleeves -->
  <path d="M150 250 L70 300 Q58 308 62 324 L92 470 Q96 486 114 480 L168 458 Z" fill="url(#gd)"/>
  <path d="M310 250 L390 300 Q402 308 398 324 L368 470 Q364 486 346 480 L292 458 Z" fill="url(#gd)"/>
  <!-- body -->
  <path d="M150 235 Q230 210 310 235 L332 250 Q352 258 356 282 L372 498 Q376 520 354 522 L106 522 Q84 520 88 498 L104 282 Q108 258 128 250 Z" fill="url(#g)"/>
  <!-- hood -->
  <ellipse cx="230" cy="150" rx="98" ry="100" fill="url(#g)"/>
  <ellipse cx="230" cy="172" rx="66" ry="82" fill="#16171b"/>
  <!-- collar -->
  <path d="M150 235 Q230 270 310 235 L300 262 Q230 294 160 262 Z" fill="url(#gd)"/>
  <!-- zipper channel -->
  <rect x="223" y="250" width="14" height="272" fill="#16171b"/>
  <rect x="234" y="250" width="3" height="272" fill="#F9DB86" opacity="0.6"/>
  <rect x="223" y="250" width="3" height="272" fill="#8a5a04" opacity="0.6"/>
  <!-- hem rib -->
  <rect x="104" y="498" width="252" height="26" rx="7" fill="url(#gd)"/>
  <line x1="150" y1="500" x2="150" y2="522" stroke="#a9700c" stroke-width="2"/>
  <line x1="230" y1="500" x2="230" y2="522" stroke="#a9700c" stroke-width="2"/>
  <line x1="310" y1="500" x2="310" y2="522" stroke="#a9700c" stroke-width="2"/>
  <!-- cuffs -->
  <rect x="92" y="450" width="72" height="24" rx="7" fill="url(#gd)" transform="rotate(-14 128 462)"/>
  <rect x="296" y="450" width="72" height="24" rx="7" fill="url(#gd)" transform="rotate(14 332 462)"/>
  <!-- sheen -->
  <path d="M152 292 Q172 382 178 470" stroke="#FCE7A0" stroke-width="6" fill="none" opacity="0.35" stroke-linecap="round"/>
